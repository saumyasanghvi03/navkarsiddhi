name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/navkar-panchang-muhurat-bugs-5iczek
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'next.config.ts'
      - 'scripts/build-capacitor-export.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # ubuntu-latest runners already ship with an Android SDK preinstalled.
      # android-actions/setup-android@v3 tries to additionally install the
      # legacy 'tools' package, which Google removed from the SDK repository
      # years ago, so it fails every run with "Failed to find package
      # 'tools'" — using it at all was the bug. This installs only the exact,
      # still-available packages this project needs (matching compileSdk/
      # targetSdk in android/variables.gradle) directly against the
      # preinstalled sdkmanager.
      - name: Install required Android SDK packages
        run: |
          if ! command -v sdkmanager &> /dev/null; then
            CMDLINE_TOOLS_BIN=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type d -name bin | sort -r | head -1)
            echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
            export PATH="$CMDLINE_TOOLS_BIN:$PATH"
          fi
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The APK bundles its own static build now (capacitor.config.ts webDir:
      # 'out') instead of loading the live site, so these NEXT_PUBLIC_ values
      # get baked into the bundle at build time — they're Firebase web config
      # and a VAPID public key, both meant to ship in client bundles, but the
      # build silently produces a broken (undefined-config) bundle without
      # them. Must match the values already set in Vercel's project settings.
      - name: Build static export for Capacitor
        run: npm run build:capacitor
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Every GitHub Actions run is a fresh VM with no ~/.android/debug.keystore,
      # so without this the Android Gradle Plugin auto-generates a brand new,
      # different debug signing key on every single build — Android then
      # refuses to install a new APK over whatever build is already on a
      # device ("App not installed", signature mismatch). Installing this
      # committed keystore first makes every CI build sign with the same key,
      # so newer APKs upgrade in place instead of needing an uninstall first.
      - name: Install shared debug keystore
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: navkarsiddhi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
